name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: observatory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations match schema
        # drizzle-kit exits 0 even when it cannot ask about a rename without a
        # terminal, so require its "no changes" line as well as a clean tree.
        run: |
          out=$(pnpm db:generate 2>&1 </dev/null) || { echo "$out"; exit 1; }
          echo "$out"
          if ! echo "$out" | grep -q "No schema changes" || [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::lib/db/schema.ts and drizzle/ differ: run pnpm db:generate and commit the migration"
            exit 1
          fi
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://dev:dev@localhost:5432/observatory_test
        run: pnpm test
      - name: Build
        run: pnpm build

  attribution:
    name: attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: No co-author trailers in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --no-warnings scripts/check-attribution.ts "$BASE" "$HEAD"
